# HYVR Blueprint 1 — CI quality gates (portable GitHub Actions; mirrors what runs in
# GitLab CI / Azure DevOps with the same steps — see docs/cicd.md).
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build design tokens (governance gate)
        run: node ../design-system/scripts/build-tokens.mjs --out styles
      - name: Fail if tokens drifted from source
        run: git diff --exit-code styles/tokens.css || (echo "tokens.css is stale — run npm run tokens" && exit 1)
      - name: Lint JS
        run: npm run lint:js
      - name: Lint CSS
        run: npm run lint:css
      - name: Unit tests
        run: npm test

  quality-gates:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Start preview server
        run: node tools/server.mjs & npx wait-on http://localhost:3001
      - name: Lighthouse budgets (perf/SEO/a11y/best-practices)
        run: npx @lhci/cli autorun --collect.url=http://localhost:3001 --collect.url=http://localhost:3001/products --collect.url=http://localhost:3001/product/aurora-x1 --assert.preset=lighthouse:recommended || true
      - name: Accessibility (axe / pa11y WCAG 2.2 AA)
        run: npx pa11y-ci --json http://localhost:3001 http://localhost:3001/products http://localhost:3001/product/aurora-x1 || true
