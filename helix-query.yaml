# Defines the searchable, machine-consumable product index that aem.live generates
# and serves at /query-index.json. This index powers product-grid, product-filter,
# and comparison, and is directly consumable by AI/answer engines (Req 4).
#
# Author-enablement convention: /drafts/** is scratch space (work-in-progress, never
# publish-eligible by accident) and /block-library/** is reference/insertable examples, not
# real site content — both are excluded from every index below so they never leak into search,
# AI-discoverable indices, or the sitemap. See getting-started-for-authors.html.
version: 1

indices:
  products:
    include:
      - '/product/**'
    exclude:
      - '/product/drafts/**'
      - '/drafts/**'
      - '/block-library/**'
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      category:
        select: head > meta[name="category"]
        value: attribute(el, 'content')
      platform:
        select: head > meta[name="platform"]
        value: attribute(el, 'content')
      brand:
        select: head > meta[name="brand"]
        value: attribute(el, 'content')
      price:
        select: head > meta[name="price"]
        value: attribute(el, 'content')
      currency:
        select: head > meta[name="currency"]
        value: attribute(el, 'content')
      availability:
        select: head > meta[name="availability"]
        value: attribute(el, 'content')
      rating:
        select: head > meta[name="rating"]
        value: attribute(el, 'content')
      fov:
        select: head > meta[name="fov"]
        value: attribute(el, 'content')
      refresh:
        select: head > meta[name="refresh"]
        value: attribute(el, 'content')
      resolution:
        select: head > meta[name="resolution"]
        value: attribute(el, 'content')
      tags:
        select: head > meta[name="tags"]
        value: attribute(el, 'content')
      summary:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      lastModified:
        select: none
        value: parseTimestamp(headers['last-modified'], 'ddd, DD MMM YYYY hh:mm:ss GMT')

  # A general site-page index — lets authors (and AI/answer engines) see what's actually live,
  # separate from the narrower product index above. Excludes scratch/reference content.
  pages:
    include:
      - '/**'
    exclude:
      - '/product/**'
      - '/drafts/**'
      - '/block-library/**'
    target: /pages-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      template:
        select: head > meta[name="template"]
        value: attribute(el, 'content')
      lastModified:
        select: none
        value: parseTimestamp(headers['last-modified'], 'ddd, DD MMM YYYY hh:mm:ss GMT')
